server:
  port: 8080

app:
  frontend:
    base-url: ${FRONT_BASE_URL}
  franchise:
    base-url: ${APP_FRANCHISE_BASE_URL}

spring:
  application:
    name: groupware
  config:
    import:
      - optional:env.yml
  profiles:
    active: dev # dev / prod / test

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  # db
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver


  # jwt
  jwt:
    secret: ${JWT_SECRET}

    redirect:
      base: ${JWT_FRONT_REDIRECT_BASE}
      landing-path: ${JWT_FRONT_CALLBACK_PATH}

    access-token:
      expiration-time: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME}
    refresh-token:
      expiration-time: ${JWT_REFRESH_TOKEN_EXPIRATION_TIME}

  #redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  # batch
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

  # health check (actuator)
management:
  endpoints:
    web:
      exposure:
        include: health

