spring:
  jpa:
    hibernate:
      ddl-auto: create
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        use_sql_comments: true

  # batch //todo jenkins 스케쥴링 연동 - 배치
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

  # db
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # jwt
  jwt:
    secret: ${JWT_SECRET}

    redirect:
      base: ${JWT_FRONT_REDIRECT_BASE}
      landing-path: ${JWT_FRONT_CALLBACK_PATH}

    access-token:
      expiration-time: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME}
    refresh-token:
      expiration-time: ${JWT_REFRESH_TOKEN_EXPIRATION_TIME}

  #redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  #docker
  docker:
    compose:
      file: ${COMPOSE_FILE_LOCATION}
      lifecycle-management: start_only


app:
  frontend:
    base-url: ${FRONT_BASE_URL}
  franchise:
    base-url: ${APP_FRANCHISE_BASE_URL}