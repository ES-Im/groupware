spring:
  # jpa
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        use_sql_comments: true
  flyway:
    enabled: false
  #docker
  docker:
    compose:
      file: ${COMPOSE_FILE_LOCATION}
      lifecycle-management: start_only


