spring:
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  flyway:
    enabled: true
  docker: # ← 추가
    compose:
      enabled: false

logging:
  level:
    org.hibernate.SQL: WARN

